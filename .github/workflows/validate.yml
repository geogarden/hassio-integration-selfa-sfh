name: Validate Selfa
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'homeassistant==2025.1.4' 'pymodbus>=3.10.0,<4.0.0' pytest pytest-asyncio ruff
      - run: ruff check custom_components tests
      - run: python -m pytest tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check custom_components/selfa_sfh/www/selfa-card.js
      - run: npm install
      - run: npm test

  release_2_2_0:
    needs: test
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release 2.2.0: read-only aligned flow card with two PV strings'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source archive
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import json; assert json.load(open("custom_components/selfa_sfh/manifest.json"))["version"] == "2.2.0"'
          git archive --format=zip HEAD custom_components/selfa_sfh > selfa-sfh-2.2.0.zip
          unzip -t selfa-sfh-2.2.0.zip
          sha256sum selfa-sfh-2.2.0.zip > selfa-sfh-2.2.0.zip.sha256
          cat > release-notes.md <<'NOTES'
          ## Selfa SFH 2.2.0

          - Dwa osobne stringi PV w górnej części schematu: moc, napięcie i prąd z odczytów PV1/PV2. Pod nimi łączna moc i dzienna energia PV.
          - Wyrównane kafelki sieci, falownika i baterii. Ikony wewnątrz kafelków; poprawiony układ na telefonie.
          - Półprzezroczyste tło i subtelne obramowania dopasowane do pulpitu.
          - Karta jest wyłącznie do odczytu: usunięto przyciski i wywołania usług sterowania z karty. Zachowano dane dzienne, fazowe i backup oraz istniejące odczyty i ustawienia integracji.
          - Animacja każdego stringu zależy od jego odczytu. Brak danych pozostaje kreską.

          Aktualizacja: HACS → Selfa SFH → aktualizuj do 2.2.0, uruchom ponownie Home Assistant i odśwież pulpit (Ctrl+F5). Dotychczasowa karta custom:selfa-card nie wymaga zmiany YAML.

          Paczka selfa-sfh-2.2.0.zip zawiera custom_components/selfa_sfh do instalacji ręcznej.
          NOTES
      - name: Publish tested release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.2.0 >/dev/null 2>&1; then
            echo 'Release already exists.'
            exit 0
          fi
          gh release create v2.2.0 selfa-sfh-2.2.0.zip selfa-sfh-2.2.0.zip.sha256 \
            --target "$SOURCE_SHA" --title "Selfa SFH 2.2.0" --notes-file release-notes.md --latest
